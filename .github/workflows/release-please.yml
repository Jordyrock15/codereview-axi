name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Maintains a release PR that bumps package.json and writes CHANGELOG.md.
      # Merging that PR is the release: this publishes the GitHub release, which
      # fires publish.yml, which puts the package on npm. Merging is the gate,
      # and nothing after it needs a human.
      #
      # Releases are deliberately not drafts. release-please decides the last
      # released version from published releases, so a pending draft made it
      # regenerate every changelog from the start of history: three release PRs
      # proposed the whole repository, including the original scaffold commit.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release above is created with GITHUB_TOKEN, and GitHub starts no
      # workflow for events from that token, so publish.yml would never see it.
      # workflow_dispatch is the documented exception and always triggers, which
      # is why the publish is dispatched rather than waited for. The tag goes with
      # it so the version guard still runs on this path.
      - name: publish the release just created
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh workflow run publish.yml --ref main --field tag="$TAG"
          echo "dispatched publish for $TAG"

